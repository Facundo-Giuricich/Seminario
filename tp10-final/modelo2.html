<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Face Landmarker + Blendshapes - Proyecto AA</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; }
        .main-container { display: flex; gap: 20px; padding: 20px; width: 95%; max-width: 1400px; justify-content: center; }
        .video-box { position: relative; border-radius: 15px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        video, canvas { display: block; border-radius: 15px; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        
        .panel-blendshapes { background: #1e293b; padding: 20px; border-radius: 15px; width: 400px; max-height: 600px; overflow-y: auto; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.5em; }
        .blendshape-row { margin-bottom: 12px; }
        .label-box { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 4px; }
        .bar-bg { background: #334155; height: 10px; border-radius: 5px; width: 100%; position: relative; }
        .bar-fill { background: linear-gradient(90deg, #38bdf8, #818cf8); height: 100%; border-radius: 5px; transition: width 0.1s; }
        
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; font-size: 1.5em; }
    </style>
</head>
<body>

    <div id="loading">Inicializando Red Neuronal y Modelos...</div>

    <h1>Face Landmarker: Análisis de Expresiones (Blendshapes)</h1>
    
    <div class="main-container">
        <div class="video-box">
            <video id="webcam" width="800" height="600" autoplay playsinline></video>
            <canvas id="output_canvas" width="800" height="600"></canvas>
        </div>

        <div class="panel-blendshapes">
            <h2>Métricas de Expresión</h2>
            <div id="blendshape-list">
                </div>
        </div>
    </div>

    <script type="module">
        import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const blendshapeList = document.getElementById("blendshape-list");
        const loadingDiv = document.getElementById("loading");

        let faceLandmarker;
        let runningMode = "VIDEO";

        // AGREGAMOS "mouthFrownLeft" para capturar el gesto de tristeza (boca hacia abajo)
        const BLENDSHAPES_INTERES = [
            "browInnerUp", "eyeBlinkLeft", "eyeBlinkRight", "jawOpen", 
            "mouthPucker", "mouthSmileLeft", "mouthSmileRight", "mouthFrownLeft", "eyeWideLeft", "eyeWideRight"
        ];

        async function setup() {
            const filesetResolver = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            
            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                    delegate: "GPU"
                },
                outputFaceBlendshapes: true,
                runningMode,
                numFaces: 1
            });

            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictWebcam);
            loadingDiv.style.display = "none";
        }

        async function predictWebcam() {
            let startTimeMs = performance.now();
            const results = faceLandmarker.detectForVideo(video, startTimeMs);

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.faceLandmarks) {
                const drawingUtils = new DrawingUtils(canvasCtx);
                for (const landmarks of results.faceLandmarks) {
                    drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "#C0C0C070", lineWidth: 1 });
                    drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE, { color: "#FF3030" });
                    drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, { color: "#30FF30" });
                    drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_FACE_OVAL, { color: "#E0E0E0" });
                    drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_LIPS, { color: "#E0E0E0" });
                }
            }

            if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                updateBlendshapes(results.faceBlendshapes[0].categories);
            }

            window.requestAnimationFrame(predictWebcam);
        }

        // --- PRE-CARGA DE IMÁGENES ---
        const imgMonoAsombro = new Image();
        imgMonoAsombro.src = './images/mono-sorprendido-con-ojos-grandes-aislados-en-blanco-fondo-273119182.webp';

        const imgMonoSonrisa = new Image();
        imgMonoSonrisa.src = './images/mono-sonriendo.webp';

        // NUEVA IMAGEN: Asegúrate de poner aquí el nombre exacto de tu archivo de mono triste
        const imgMonoTriste = new Image();
        imgMonoTriste.src = './images/mono-triste.webp'; 

        function updateBlendshapes(categories) {
            let html = "";
            let imagenActiva = null; 
            let emojiRespaldo = ""; 

            categories.forEach(cat => {
                if (BLENDSHAPES_INTERES.includes(cat.categoryName)) {
                    const score = cat.score * 100;
                    const val = score.toFixed(0);
                    
                    // --- LÓGICA DE REACCIÓN MEJORADA ---
                    if (cat.categoryName === "mouthSmileLeft" && score > 65) {
                        imagenActiva = imgMonoSonrisa; 
                    } else if (cat.categoryName === "jawOpen" && score > 60) {
                        imagenActiva = imgMonoAsombro; 
                    } else if (cat.categoryName === "mouthFrownLeft" && score > 10) { 
                        // Si la comisura de los labios baja más del 55%, se activa el mono triste
                        imagenActiva = imgMonoTriste; 
                    } else if (cat.categoryName === "mouthPucker" && score > 60) {
                        emojiRespaldo = "😗"; 
                    }

                    html += `
                        <div class="blendshape-row">
                            <div class="label-box">
                                <span>${cat.categoryName}</span>
                                <span>${val}%</span>
                            </div>
                            <div class="bar-bg">
                                <div class="bar-fill" style="width: ${val}%"></div>
                            </div>
                        </div>
                    `;
                }
            });
            blendshapeList.innerHTML = html;

            // --- DIBUJAR EN EL CANVAS ---
            if (imagenActiva !== null) {
                const anchoImagen = 120;
                const altoImagen = 120;
                const posX = canvasElement.width - anchoImagen - 20; 
                const posY = 20;

                canvasCtx.drawImage(imagenActiva, posX, posY, anchoImagen, altoImagen);
            } else if (emojiRespaldo !== "") {
                canvasCtx.font = "80px Arial";
                canvasCtx.fillText(emojiRespaldo, canvasElement.width - 100, 100);
            }
        }

        setup();
    </script>
</body>
</html>
