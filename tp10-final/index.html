<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección Facial - Grupo [Tu Número]</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>

    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #2c3e50; color: white; }
        .contenedor { position: relative; display: inline-block; margin-top: 20px; border: 4px solid #34495e; border-radius: 10px; overflow: hidden; }
        /* Superponer el canvas de dibujo exactamente encima del video */
        video, canvas { display: block; }
        canvas { position: absolute; top: 0; left: 0; }
        #estado { font-size: 1.2em; color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Modelo: Face Landmarks Detection</h1>
    <p id="estado">Solicitando permiso para la cámara y cargando modelo (esto puede tardar unos segundos)...</p>

    <div class="contenedor">
        <video id="video" width="640" height="480" autoplay muted playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const estado = document.getElementById('estado');

        // Función para encender la cámara web
        async function iniciarCamara() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => { resolve(video); };
            });
        }

        // Función principal que ejecuta el modelo
        async function ejecutarModelo() {
            await iniciarCamara();
            video.play();

            // Configurar y cargar el modelo Face Mesh
            const modelo = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
            const configDetector = {
                runtime: 'tfjs', // Usamos TensorFlow.js puro
            };
            const detector = await faceLandmarksDetection.createDetector(modelo, configDetector);
            
            estado.innerText = "¡Modelo cargado! Procesando en tiempo real...";
            estado.style.color = "#2ecc71";

            // Bucle infinito para analizar cada cuadro del video
            async function detectarYDibujar() {
                // El modelo analiza la imagen de la cámara
                const rostros = await detector.estimateFaces(video);
                
                // Limpiar el dibujo anterior
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Si encuentra una cara, dibuja los puntos
                if (rostros.length > 0) {
                    rostros.forEach(rostro => {
                        ctx.fillStyle = "#00ff00"; // Color verde neón para los puntos
                        rostro.keypoints.forEach(punto => {
                            ctx.beginPath();
                            ctx.arc(punto.x, punto.y, 1.5, 0, 2 * Math.PI); // Dibuja un circulito
                            ctx.fill();
                        });
                    });
                }
                
                // Volver a llamar a la función para el siguiente cuadro (frame)
                requestAnimationFrame(detectarYDibujar);
            }
            detectarYDibujar();
        }

        // Arrancar todo
        ejecutarModelo();
    </script>
</body>
</html>
