<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro de Alumnos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181c27;
      --surface2:  #1e2335;
      --border:    #2a3050;
      --accent:    #3d7fff;
      --accent-dim:#1e3a70;
      --green:     #22c55e;
      --green-bg:  #052e16;
      --red:       #ef4444;
      --red-bg:    #2d0a0a;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    10px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px 60px;
    }

    /* Header */
    header {
      max-width: 780px;
      margin: 0 auto 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeDown 0.5s ease both;
    }

    .logo {
      width: 44px; height: 44px;
      background: var(--accent);
      border-radius: 10px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }

    .logo svg { width: 22px; height: 22px; fill: #fff; }

    header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Layout */
    .container {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      animation: fadeUp 0.4s ease both;
    }

    .card:nth-child(2) { animation-delay: 0.08s; }
    .card:nth-child(3) { animation-delay: 0.16s; }

    .card-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Form */
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr 160px;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 580px) {
      .fields { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .field input::placeholder { color: var(--muted); opacity: 0.6; }

    /* Buttons */
    .btn {
      padding: 10px 22px;
      border: none;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.12s;
      letter-spacing: 0.01em;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* Mensaje */
    #mensaje {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
    }

    #mensaje.exito {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid #166534;
      display: block;
    }

    #mensaje.error {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid #7f1d1d;
      display: block;
    }

    /* Tabla */
    .table-wrap {
      overflow-x: auto;
      margin-top: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    thead th {
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 10px 16px;
      text-align: left;
    }

    tbody td {
      padding: 11px 16px;
      border-top: 1px solid var(--border);
      font-family: 'DM Mono', monospace;
      font-size: 0.84rem;
    }

    tbody tr:hover { background: var(--surface2); }

    .badge-dni {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .consultar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #count {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Status bar */
    .status-bar {
      display: flex;
      gap: 20px;
      font-size: 0.75rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      animation: fadeUp 0.4s 0.24s ease both;
    }

    .status-item { display: flex; align-items: center; gap: 6px; }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* Animaciones */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 7 3 12s4 9 9 9 9-4 9-9-4-9-9-9zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 10c-2.67 0-5-1.34-6.44-3.38C6.55 12.1 9.28 11 12 11s5.45 1.1 6.44 2.62C16.99 15.66 14.67 17 12 17z"/></svg>
    </div>
    <div>
      <h1>Sistema de Registro de Alumnos</h1>
      <p>VM3 — Apache :8080 → VM2 — Node.js :3454 → VM1 — MariaDB :3306</p>
    </div>
  </header>

  <div class="container">

    <!-- Status -->
    <div class="status-bar">
      <div class="status-item">
        <span class="dot ok" id="dot-backend"></span>
        <span id="label-backend">Verificando backend...</span>
      </div>
      <div class="status-item">
        <span class="dot ok"></span>
        <span>Frontend Apache :8080</span>
      </div>
    </div>

    <!-- Formulario -->
    <div class="card">
      <div class="card-title">Cargar alumno</div>
      <div class="fields">
        <div class="field">
          <label>Apellidos</label>
          <input type="text" id="apellidos" placeholder="García López">
        </div>
        <div class="field">
          <label>Nombres</label>
          <input type="text" id="nombres" placeholder="Juan Carlos">
        </div>
        <div class="field">
          <label>DNI</label>
          <input type="text" id="dni" placeholder="12345678">
        </div>
      </div>
      <button class="btn btn-primary" onclick="grabarAlumno()">Guardar alumno</button>
      <div id="mensaje"></div>
    </div>

    <!-- Tabla -->
    <div class="card">
      <div class="card-title">Lista de alumnos</div>
      <div class="consultar-row">
        <button class="btn btn-secondary" onclick="consultarAlumnos()">Consultar todos</button>
        <span id="count"></span>
      </div>
      <div class="table-wrap" id="table-wrap" style="display:none">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Apellidos</th>
              <th>Nombres</th>
              <th>DNI</th>
            </tr>
          </thead>
          <tbody id="cuerpo"></tbody>
        </table>
      </div>
      <div class="empty-state" id="empty-state" style="display:none">
        No hay alumnos registrados aún.
      </div>
    </div>

  </div>

  <script>
    const BACKEND = 'http://localhost:3454';

    //  Verificar conexión al backend al cargar   
    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${BACKEND}/consultarAlumnos`)
        .then(() => {
          document.getElementById('dot-backend').classList.add('ok');
          document.getElementById('label-backend').textContent = 'Backend Node.js :3454 — conectado';
        })
        .catch(() => {
          document.getElementById('dot-backend').style.background = 'var(--red)';
          document.getElementById('label-backend').textContent = 'Backend Node.js :3454 — sin conexión';
        });
    });

    // Grabar alumno   
    function grabarAlumno() {
      const apellidos = document.getElementById('apellidos').value.trim();
      const nombres   = document.getElementById('nombres').value.trim();
      const dni       = document.getElementById('dni').value.trim();
      const msg       = document.getElementById('mensaje');

      if (!apellidos || !nombres || !dni) {
        mostrarMensaje('error', 'Completá todos los campos antes de guardar.');
        return;
      }

      fetch(`${BACKEND}/grabaAlumnos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apellidos, nombres, dni })
      })
      .then(r => r.json())
      .then(data => {
        if (data.resultado === 1) {
          mostrarMensaje('exito', '✓ ' + data.mensaje);
          document.getElementById('apellidos').value = '';
          document.getElementById('nombres').value   = '';
          document.getElementById('dni').value       = '';
        } else {
          mostrarMensaje('error', '✗ ' + data.mensaje);
        }
      })
      .catch(() => mostrarMensaje('error', '✗ Error conectando al servidor backend.'));
    }

    // Consultar alumnos   
    function consultarAlumnos() {
      fetch(`${BACKEND}/consultarAlumnos`)
      .then(r => r.json())
      .then(data => {
        const cuerpo     = document.getElementById('cuerpo');
        const tableWrap  = document.getElementById('table-wrap');
        const emptyState = document.getElementById('empty-state');
        const count      = document.getElementById('count');

        cuerpo.innerHTML = '';

        if (data.length === 0) {
          tableWrap.style.display  = 'none';
          emptyState.style.display = 'block';
          count.textContent = '';
          return;
        }

        data.forEach((a, i) => {
          cuerpo.innerHTML += `
            <tr>
              <td>${i + 1}</td>
              <td>${escapeHtml(a.apellidos)}</td>
              <td>${escapeHtml(a.nombres)}</td>
              <td><span class="badge-dni">${escapeHtml(a.dni)}</span></td>
            </tr>`;
        });

        tableWrap.style.display  = 'block';
        emptyState.style.display = 'none';
        count.textContent        = `${data.length} alumno${data.length !== 1 ? 's' : ''} registrado${data.length !== 1 ? 's' : ''}`;
      })
      .catch(() => mostrarMensaje('error', '✗ Error al consultar la base de datos.'));
    }

    //  Helpers 
    function mostrarMensaje(tipo, texto) {
      const msg = document.getElementById('mensaje');
      msg.className   = tipo;
      msg.textContent = texto;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Enter en DNI dispara el guardado
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('dni').addEventListener('keydown', e => {
        if (e.key === 'Enter') grabarAlumno();
      });
    });
  </script>
</body>
</html>
