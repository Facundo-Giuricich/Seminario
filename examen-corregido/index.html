<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precio del Petróleo</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            margin-top: 100px;
        }

        .card{
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            background: #1e1e1e;
            box-shadow: 0 0 10px rgba(0,0,0,.5);
        }

        h1{
            color: orange;
        }

        #precio{
            font-size: 2rem;
            margin-top: 20px;
            color: #4CAF50;
        }

        button{
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            background: orange;
            color: white;
            border-radius: 5px;
        }

        button:hover{
            background: darkorange;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Precio del Petróleo</h1>

<p>Petróleo Crudo</p>
        <div id="precio">
            Cargando...
        </div>

        <button onclick="obtenerPrecio()">
            Actualizar
        </button>
    </div>

    <script>

async function obtenerPrecio() {

    const precio = document.getElementById("precio");

    try {

        const response = await fetch(
            "https://api.api-ninjas.com/v1/commodityprice?name=crude_oil",
            {
                headers: {
                    "X-Api-Key": "VH2GUDxbsv82cE07LXXtCNUhF114rk1hHOLlyd1t"
                }
            }
        );

        const data = await response.json();

        console.log("Data:", data);

        precio.innerHTML = `
            $ ${data.price} ${data.currency_unit}
        `;

    } catch(error) {

        precio.innerHTML = "Error al cargar";

        console.error(error);
    }
}

        obtenerPrecio();

    </script>

</body>
</html>
